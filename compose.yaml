services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: receiver
      POSTGRES_USER: receiver
      POSTGRES_PASSWORD: receiver_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiver -d receiver"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: receiver
      PGPASSWORD: receiver_dev_password
      PGDATABASE: receiver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ["sh", "-c", "npm run db:migrate && npm start"]

volumes:
  postgres-data:
